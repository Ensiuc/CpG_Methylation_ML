[project]
name = "cpg_ml"
version = "0.1.0"
description = "CpG methylation ML pipeline across early-life exposure cohorts"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[dependencies]
python = "3.10.*"
numpy = ">=1.24"
pandas = ">=2.0"
scipy = ">=1.11"
scikit-learn = ">=1.3"
umap-learn = ">=0.5.3"
matplotlib = ">=3.7"
seaborn = ">=0.12"
h5py = ">=3.8"
jupyter = "*"
ipykernel = "*"
tqdm = "*"
joblib = "*"

[pypi-dependencies]
mofapy2 = ">=0.7.0"
# mofapy2 is only on PyPI, not conda-forge — pixi handles both seamlessly

[tasks]
# Run these with: pixi run <task_name>
preprocess = "jupyter nbconvert --to notebook --execute notebooks/01_preprocess_wgbs.ipynb"
notebook   = "jupyter notebook"
